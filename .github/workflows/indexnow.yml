# After each change to the live site, tell Bing which pages changed (IndexNow). Run it by hand with "all" to
# submit every page in sitemap.xml (do that once after this is merged).
name: indexnow
on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml"]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in sitemap.xml"
        type: boolean
        default: true

permissions: { contents: read }

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Wait for GitHub Pages to publish the change
        if: github.event_name == 'push'
        run: sleep 150
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$ALL" = "true" ]; then
            python3 .github/scripts/indexnow.py all
          else
            base="$BEFORE"; git cat-file -e "$base" 2>/dev/null || base="HEAD~1"
            python3 .github/scripts/indexnow.py changed $(git diff --name-only "$base" HEAD)
          fi
